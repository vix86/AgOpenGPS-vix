# CereaBridge default profile
# Leave serial numbers at 0 to use the first matching device/channel,
# or set exact serials for your motor and encoder Phidgets.

ListenPort=18888
ListenPortFallback=8888
AgioHost=127.0.0.1
AgioPort=9999

UsePhidgets=True
PhidgetsDeviceSerialNumber=0
PhidgetsMotorSerialNumber=0
PhidgetsEncoderSerialNumber=0
PhidgetsMotorChannel=0
PhidgetsEncoderChannel=0
ReverseMotor=False
ReverseWas=False

UseImuBrick=True
ImuHost=localhost
ImuPort=4223
ImuUid=
ReverseRoll=False
ReverseHeading=False
HeadingOffset16=0

CountsPerDegreeFallback=30
WasOffsetFallback=0
VelocityGainMultiplier=1.0
MaxMotorOutput=1.0
DeadbandDegrees=0.25
TelemetryPeriodMs=50
HelloPeriodMs=250
SteerSwitchOn=True
WorkSwitchOn=False
