# Cerea-style Phidgets No-WAS integration for AgOpenGPS
# Default is OFF. Standard AgOpenGPS behavior is unchanged until enabled=true.

[bridge]
enabled=false

[safety]
requireRtkFix=true
minSpeedKph=0.4
maxSpeedKph=20.0
gpsWatchdogMs=500

[controller]
lookAheadMeters=8.0
crossTrackGain=0.18
headingGain=0.035
maximumCommand=0.45
minimumCommand=0.02
commandRateLimitPerCycle=0.05
invertGuidanceCommand=false

[encoder]
softLimitCounts=18000
hardLimitCounts=24000
centeringGain=0.08
movementThresholdCounts=4
stallDetection=false
stallCommandThreshold=0.12
stallTimeoutMs=750

[motor]
maximumTargetVelocity=0.35
acceleration=4.0
invertMotorOutput=false
openTimeoutMs=5000

[imu]
enabled=false
host=localhost
port=4223
uid=
headingOffsetDegrees=0.0
feedAogAhrs=true
