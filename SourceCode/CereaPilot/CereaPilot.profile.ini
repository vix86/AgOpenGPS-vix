# CereaPilot safe default profile
# Motor output is disabled by default every time the app starts.

[gps]
port=
baud=115200

[imu]
host=localhost
# Keep IMU port on default 4223 in code for now.
# Do not add another 'port=' key until the section-aware profile parser is added.
uid=

[controller]
lookAheadMeters=8.0
xteGain=0.18
headingGain=0.035
maxCommand=0.45
minSpeedKph=0.4
maxSpeedKph=20.0
requireRtkFix=true
controlPeriodMs=50
watchdogMs=300

[motor]
maxVelocity=0.35
encoderSoftLimitCounts=18000
encoderHomeToleranceCounts=200
invertMotor=false
