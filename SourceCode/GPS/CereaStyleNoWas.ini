# Cerea-style Phidgets No-WAS integration for AgOpenGPS
# Default is OFF. Standard AgOpenGPS behavior is unchanged until enabled=true.
# Hardware path intentionally matches the working CereaBridge approach:
# Phidget22.DCMotor + Phidget22.Encoder + Tinkerforge BrickIMUV2.

[bridge]
enabled=false

[startup]
panelMinimized=true
autoConnect=true
autoArm=true
autoStartWithAogAutoSteer=true

[safety]
requireRtkFix=true
minSpeedKph=0.4
maxSpeedKph=20.0
gpsWatchdogMs=500

[controller]
lookAheadMeters=8.0
crossTrackGain=0.18
headingGain=0.035
maximumCommand=0.45
minimumCommand=0.02
commandRateLimitPerCycle=0.05
invertGuidanceCommand=false

[encoder]
softLimitCounts=18000
hardLimitCounts=24000
centeringGain=0.08
movementThresholdCounts=4
stallDetection=false
stallCommandThreshold=0.12
stallTimeoutMs=750

[motor]
driver=phidget22
# sharedSerial is used if motorSerial/encoderSerial are 0.
serial=0
motorSerial=0
encoderSerial=0
motorChannel=0
encoderChannel=0
maximumTargetVelocity=0.35
acceleration=4.0
invertMotorOutput=false
openTimeoutMs=5000

[imu]
enabled=false
host=localhost
port=4223
uid=
headingOffsetDegrees=0.0
feedAogAhrs=true
